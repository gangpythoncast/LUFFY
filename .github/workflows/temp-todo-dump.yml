name: temp-apply-todo-readme

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report (dry run) or apply (commit README)"
        required: true
        default: report
        type: choice
        options:
          - report
          - apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run TODO README transform
        id: run
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: python3 .github/apply_todo_readme.py
      - name: Show report
        if: always()
        run: |
          echo "===== REPORT ====="
          cat .apply_report/report.txt 2>/dev/null || true
          echo "===== DIFF (head) ====="
          head -c 11000 .apply_report/README.diff 2>/dev/null || true
      - name: Publish report branch
        if: always()
        run: |
          git config user.name gangpythoncast
          git config user.email lindaphillipse286@gmail.com
          git checkout -B temp/apply-report
          git add -f .apply_report
          git commit -m "temp: apply report" --allow-empty
          git push -f origin temp/apply-report
