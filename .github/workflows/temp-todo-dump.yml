name: temp-apply-todo-readme

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report (dry run) or apply (commit README)"
        required: true
        default: report
        type: choice
        options:
          - report
          - apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch helper for real run
        run: |
          python3 - <<'PY'
          p = ".github/apply_todo_readme.py"
          s = open(p, encoding="utf-8").read()
          repls = [
            ('diff = git("diff", "--name-only", "origin/main...HEAD", "--", "*.py")',
             'diff = git("diff", "--name-only", "origin/main...HEAD")'),
            ('changed = [p for p in diff.stdout.splitlines() if p.endswith(".py")]',
             'changed = [p for p in diff.stdout.splitlines() if p.endswith(".py") and not p.startswith(".") and "/." not in p]'),
            ('    old_data = git("show", "origin/main:%s" % path).stdout\n    with open(path, "rb") as f:\n        new_data = f.read()',
             '    _exists = git("cat-file", "-e", "origin/main:%s" % path, check=False)\n    old_data = git("show", "origin/main:%s" % path).stdout if _exists.returncode == 0 else ""\n    new_data = open(path, "rb").read() if os.path.exists(path) else b""'),
            ('elif om["text"] != e["text"]:',
             'elif om["text"].replace("): ", ") ") != e["text"].replace("): ", ") "):'),
            ('final = [(l, t) for p, l, t in res_entries if p == path]',
             'final = [(l, t.replace("): ", ") ")) for p, l, t in res_entries if p == path]'),
            ('expect = [(m["line"], m["text"]) for m in extract_markers(open(path, "rb").read())]',
             'expect = [(m["line"], m["text"].replace("): ", ") ")) for m in extract_markers(open(path, "rb").read())]'),
          ]
          ok = True
          for old, new in repls:
              if old not in s:
                  print("MISSING PATTERN:", old[:80])
                  ok = False
              s = s.replace(old, new)
          open(p, "w", encoding="utf-8").write(s)
          print("patch_ok=", ok)
          assert ok
          PY
      - name: Run TODO README transform
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set +e
          mkdir -p .apply_report
          python3 .github/apply_todo_readme.py > .apply_report/run_stdout.txt 2> .apply_report/run_stderr.txt
          echo "python_exit=$?" > .apply_report/exit_code.txt
          exit 0
      - name: Publish report branch
        if: always()
        run: |
          set +e
          git config user.name gangpythoncast
          git config user.email lindaphillipse286@gmail.com
          git checkout -B temp/apply-report
          git add -f .apply_report
          git commit -m "temp: apply report" --allow-empty
          git push -f origin temp/apply-report
          exit 0
